<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128" role="img" aria-label="Qoder Token 用量与费用统计">
  <defs>
    <!-- 底板：顶部光源径向渐变（饱和宝石蓝） -->
    <radialGradient id="bg" cx="0.5" cy="0.03" r="1.2">
      <stop offset="0" stop-color="#5468b8"/>
      <stop offset="0.45" stop-color="#4050a0"/>
      <stop offset="1" stop-color="#2f3d85"/>
    </radialGradient>
    <!-- 边框：紫→蓝渐隐描边 -->
    <linearGradient id="rim" x1="0" y1="0" x2="0.8" y2="1">
      <stop offset="0" stop-color="#b9a5ff" stop-opacity="0.95"/>
      <stop offset="0.45" stop-color="#5b96ff" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#5b96ff" stop-opacity="0.12"/>
    </linearGradient>
    <!-- 柱体：三柱共享的连续渐变（越高越紫） -->
    <linearGradient id="bars" gradientUnits="userSpaceOnUse" x1="0" y1="106" x2="0" y2="54">
      <stop offset="0" stop-color="#2f6bff"/>
      <stop offset="0.5" stop-color="#7a5aff"/>
      <stop offset="1" stop-color="#c0a4ff"/>
    </linearGradient>
    <!-- 金币币面：金属对角渐变 -->
    <linearGradient id="coin" x1="0.15" y1="0" x2="0.85" y2="1">
      <stop offset="0" stop-color="#c9b3ff"/>
      <stop offset="0.45" stop-color="#9168ff"/>
      <stop offset="1" stop-color="#5a3fd6"/>
    </linearGradient>
    <!-- 金币币缘：上亮下深的金属环 -->
    <linearGradient id="ring" x1="0" y1="0" x2="0.4" y2="1">
      <stop offset="0" stop-color="#ece2ff"/>
      <stop offset="1" stop-color="#7a8cff"/>
    </linearGradient>
    <!-- 柱身玻璃高光 -->
    <linearGradient id="hl" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.6"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.04"/>
    </linearGradient>
    <!-- 基线：两端淡出 -->
    <linearGradient id="base" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0.3"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <!-- 符号微光 -->
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="1.4" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <!-- 焦点柔光（金币光晕专用） -->
    <filter id="focus" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="4"/>
    </filter>
  </defs>

  <!-- 底板与边框 -->
  <rect x="8" y="8" width="112" height="112" rx="28" fill="url(#bg)"/>
  <rect x="9.25" y="9.25" width="109.5" height="109.5" rx="26.75" fill="none" stroke="url(#rim)" stroke-width="2.5"/>

  <!-- 基线 -->
  <rect x="22" y="104" width="76" height="1.8" rx="0.9" fill="url(#base)"/>

  <!-- 数据柱（token 用量，从小到高递增） -->
  <g fill="url(#bars)">
    <rect x="26" y="82" width="16" height="22" rx="5"/>
    <rect x="51" y="68" width="16" height="36" rx="5"/>
    <rect x="76" y="56" width="16" height="48" rx="5"/>
  </g>

  <!-- 柱身玻璃高光 -->
  <g fill="url(#hl)">
    <rect x="29.4" y="87" width="2.6" height="13" rx="1.3"/>
    <rect x="54.4" y="73" width="2.6" height="27" rx="1.3"/>
    <rect x="79.4" y="61" width="2.6" height="39" rx="1.3"/>
  </g>

  <!-- 费用金币（视觉焦点，悬浮于最高柱顶） -->
  <circle cx="84" cy="33" r="19.5" fill="#a98bff" opacity="0.22" filter="url(#focus)"/>
  <circle cx="84" cy="34.2" r="16" fill="#241d4a"/>
  <circle cx="84" cy="33" r="16" fill="url(#coin)"/>
  <circle cx="84" cy="33" r="16" fill="none" stroke="url(#ring)" stroke-width="2.2"/>
  <circle cx="84" cy="33" r="13" fill="none" stroke="#ffffff" stroke-opacity="0.3" stroke-width="1.3"/>
  <path d="M71.3 28.4 A13.5 13.5 0 0 1 82.8 19.6" fill="none" stroke="#ffffff" stroke-opacity="0.5" stroke-width="1.6" stroke-linecap="round"/>
  <!-- 币面 ¥ 符号 -->
  <g fill="none" stroke="#ffffff" stroke-width="2.6" stroke-linecap="round" opacity="0.95" filter="url(#glow)">
    <path d="M77.2 23.5 L84 30.8"/>
    <path d="M90.8 23.5 L84 30.8"/>
    <path d="M84 30.8 V 42.5"/>
    <path d="M78 36.3 H 90"/>
    <path d="M78 40.3 H 90"/>
  </g>
</svg>
